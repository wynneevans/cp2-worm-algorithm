# Worm runs for <n3> versus mu3 at beta*J = 56.3, mu8 = 0 (not set, so it defaults to 0).
# The mu3 = 0 point is in its own file, mu3_0_b56.3.toml.
# dt = 4*beta/Lt = 4*56.3/4504 = 0.05, the dt of the rows in probabilities.txt.
# The lattice [100, 12, 4504] is an assumption: Ly = 12 as in the paper, Lx = beta*c = 100 for a
# square volume (c = 1.7763). Change Lx if the paper's runs used another length.
# The program does no thermalisation: discard the first measurements when analysing.
# Run all:  build/release/src/wormCP2Mu2dAFMplaq configs/mu3_scan_b56.3.toml
# Run one:  build/release/src/wormCP2Mu2dAFMplaq configs/mu3_scan_b56.3.toml --only mu3_0.01

[defaults]
bc            = "y-open"
measurements  = 100000

[[run]]
name    = "mu3_0.01"
beta    = 56.3
lattice = [100, 12, 4504]   # Lx, Ly, Lt
mu3     = 0.01

[[run]]
name    = "mu3_0.02"
beta    = 56.3
lattice = [100, 12, 4504]   # Lx, Ly, Lt
mu3     = 0.02

[[run]]
name    = "mu3_0.03"
beta    = 56.3
lattice = [100, 12, 4504]   # Lx, Ly, Lt
mu3     = 0.03

[[run]]
name    = "mu3_0.04"
beta    = 56.3
lattice = [100, 12, 4504]   # Lx, Ly, Lt
mu3     = 0.04
