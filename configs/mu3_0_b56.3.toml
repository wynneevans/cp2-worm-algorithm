# Worm run for the mu3 = 0 point (mu8 = 0) at beta*J = 56.3, split out of mu3_scan_b56.3.toml.
# dt = 4*beta/Lt = 4*56.3/4504 = 0.05, the dt of the mu3 = 0 row in probabilities.txt.
# The lattice [100, 12, 4504] is an assumption: Ly = 12 as in the paper, Lx = beta*c = 100 for a
# square volume (c = 1.7763). Change Lx if the paper's runs used another length.
# The program does no thermalisation: discard the first measurements when analysing.
# Run:  build/release/src/wormCP2Mu2dAFMplaq configs/mu3_0_b56.3.toml

[defaults]
bc            = "y-open"
measurements  = 100000

[[run]]
name    = "mu3_0.0"
beta    = 56.3
lattice = [100, 12, 4504]   # Lx, Ly, Lt
mu3     = 0.0
