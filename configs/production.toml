# Production runs (replaces scripts/run_worm.zsh). Run all enabled runs with:
#   build/release/src/wormCP2Mu2dAFMplaq configs/production.toml
# Run one (even a disabled one) with --only NAME. Without a seed each run draws a
# random one and records it in run_<time>.toml next to the results.
# Every run here has dt = 4*beta/Lt = 0.05, the row present in probabilities.txt.

[defaults]
bc            = "closed"
measurements  = 100000
mu3           = 0.0
mu8           = 0.0

[[run]]
name = "closed_b10_20x4x800"
beta = 10.0
lattice = [20, 4, 800]
enabled = false

[[run]]
name = "closed_b2.5_4x4x200"
beta = 2.5
lattice = [4, 4, 200]

[[run]]
name = "closed_b5_20x4x400"
beta = 5.0
lattice = [20, 4, 400]

[[run]]
name = "closed_b5_8x8x400"
beta = 5.0
lattice = [8, 8, 400]

[[run]]
name = "closed_b5_8x4x400"
beta = 5.0
lattice = [8, 4, 400]

[[run]]
name = "closed_b10_8x8x800"
