# Exact comparison: 2x3 lattice, y-open boundary, beta = 0.05, mu3 = mu8 = 0.
# Checked against tests/exact/exactCP2_results.csv rows "2x3,y-open,0.050,0.000,0.000":
#   susceptibility = 0.008094515, magnetization = 0
# Lt = 4 gives dt = 4*beta/Lt = 0.05, the row in configs/probabilities.txt.
# The program does no thermalisation: discard the first measurements when analysing.
# Run: build/release/src/wormCP2Mu2dAFMplaq tests/exact/2x3_yopen_mu0.toml   (add --seed N to repeat)

[defaults]
bc            = "y-open"
measurements  = 1000000
probabilities = "../../configs/probabilities.txt"   # relative to this file
output        = "../../data/exact"
mu3           = 0.0
mu8           = 0.0
sim           = 1

[[run]]
name    = "2x3_yopen_b0.05_Lt4"
beta    = 0.05
lattice = [2, 3, 4]   # Lx, Ly, Lt
seed    = 20250103
