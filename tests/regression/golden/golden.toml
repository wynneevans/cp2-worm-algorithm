# Fixed-seed case behind golden/M.dat and golden/C.dat. The test overrides the data
# directory and (for the negative test) the seed on the command line.
[defaults]
bc            = "closed"
measurements  = 1000
probabilities = "probabilities.txt"

[[run]]
name    = "golden"
beta    = 2.50
lattice = [4, 4, 200]
seed    = 42
