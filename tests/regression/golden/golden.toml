# Fixed-seed cases behind golden/M_<name>.dat and golden/C_<name>.dat (or their .sha256). The test overrides the data
# directory and (for the negative test) the seed on the command line.
[defaults]
bc            = "closed"
measurements  = 1000
probabilities = "probabilities.txt"

[[run]]
name    = "golden"
beta    = 2.50
lattice = [4, 4, 200]
seed    = 42

# y-open has its own neighbour set-up, with separate branches for even and odd Ly.
[[run]]
name    = "yopen_even"
bc      = "y-open"
beta    = 2.50
lattice = [4, 2, 200]
seed    = 42

[[run]]
name    = "yopen_odd"
bc      = "y-open"
beta    = 2.50
lattice = [4, 3, 200]
seed    = 42

# mu enters only through the probability row, which changes the moves the worm takes.
[[run]]
name    = "yopen_mu3"
bc      = "y-open"
beta    = 2.50
lattice = [4, 4, 200]
mu3     = 0.2
seed    = 42

[[run]]
name    = "yopen_mu8"
bc      = "y-open"
beta    = 2.50
lattice = [4, 4, 200]
mu8     = 0.2
seed    = 42

# Longer runs on a bigger lattice. They reach rare worm states the cases above never meet (some start
# and bounce plaquettes in positionTool and bounceTool), measured with a coverage build on
# 2026-10-29. Their output is about 9 MB each, so only SHA-256 checksums are stored
# (golden/{M,C}_<name>.sha256).
[[run]]
name         = "cover_mu3"
bc           = "y-open"
measurements = 10000
beta         = 5.0
lattice      = [16, 16, 400]
mu3          = 0.2
seed         = 42

[[run]]
name         = "cover_mu8"
bc           = "y-open"
measurements = 10000
beta         = 5.0
lattice      = [16, 16, 400]
mu8          = 0.2
seed         = 42
